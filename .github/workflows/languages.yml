name: Update language stats

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate language statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import re

          username = "Nomad07"
          readme_file = "README.md"

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-language-stats"
          }

          languages = {}
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  repos = json.load(response)

              if not repos:
                  break

              for repo in repos:
                  # Skip forks
                  if repo.get("fork"):
                      continue

                  # Skip archived repositories
                  if repo.get("archived"):
                      continue

                  request = urllib.request.Request(
                      repo["languages_url"],
                      headers=headers
                  )

                  with urllib.request.urlopen(request) as response:
                      repo_languages = json.load(response)

                  for language, amount in repo_languages.items():
                      languages[language] = (
                          languages.get(language, 0) + amount
                      )

              page += 1

          total = sum(languages.values())

          if total == 0:
              print("No language data found.")
              exit(0)

          sorted_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True
          )

          lines = []

          for language, amount in sorted_languages:
              percentage = amount / total * 100

              if percentage < 0.1:
                  continue

              lines.append(
                  f"- **{language}** {percentage:.1f}%"
              )

          start_marker = "<!-- LANGUAGES:START -->"
          end_marker = "<!-- LANGUAGES:END -->"

          language_block = (
              start_marker
              + "\n"
              + "\n".join(lines)
              + "\n"
              + end_marker
          )

          with open(readme_file, "r", encoding="utf-8") as file:
              content = file.read()

          pattern = re.compile(
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker),
              re.DOTALL
          )

          if pattern.search(content):
              content = pattern.sub(language_block, content)
          else:
              content = content.replace(
                  "## Languages",
                  "## Languages\n\n" + language_block
              )

          with open(readme_file, "w", encoding="utf-8") as file:
              file.write(content)

          print("Updated language statistics:")
          print("\n".join(lines))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update language stats"
            git push
          fi
