name: Update language stats

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update language stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request

          username = "Nomad07"
          readme = "README.md"

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-language-stats"
          }

          languages = {}

          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}"
              )

              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  repos = json.load(response)

              if not repos:
                  break

              for repo in repos:
                  if repo.get("archived"):
                      continue

                  lang_url = repo["languages_url"]

                  request = urllib.request.Request(
                      lang_url,
                      headers=headers
                  )

                  with urllib.request.urlopen(request) as response:
                      repo_languages = json.load(response)

                  for language, bytes_count in repo_languages.items():
                      languages[language] = (
                          languages.get(language, 0) + bytes_count
                      )

              page += 1

          total = sum(languages.values())

          if total == 0:
              print("No language data found.")
              raise SystemExit(0)

          sorted_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True
          )

          lines = []

          for language, bytes_count in sorted_languages:
              percentage = bytes_count / total * 100

              if percentage < 0.1:
                  continue

              slug = language.lower().replace("#", "sharp").replace("+", "plus")

              lines.append(
                  f'- [**{language}**]'
                  f'(https://github.com/{username}?tab=repositories)'
                  f' {percentage:.1f}%'
              )

          block = "\n".join(lines)

          with open(readme, "r", encoding="utf-8") as file:
              content = file.read()

          start = "<!-- LANGUAGES:START -->"
          end = "<!-- LANGUAGES:END -->"

          new_block = (
              f"{start}\n"
              f"{block}\n"
              f"{end}"
          )

          pattern = re.compile(
              re.escape(start) + r".*?" + re.escape(end),
              re.DOTALL
          )

          if pattern.search(content):
              content = pattern.sub(new_block, content)
          else:
              marker = "## Languages"
              content = content.replace(
                  marker,
                  marker + "\n\n" + new_block
              )

          with open(readme, "w", encoding="utf-8") as file:
              file.write(content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update language stats"
            git push
          fi
